name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B ../progression-tests -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build ../progression-tests --parallel 2
      - run: ctest --test-dir ../progression-tests --output-on-failure
  core-compile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: azerothcore/azerothcore-wotlk
            ref: 70dda745ba9e9e2ed96f8b4b1be10bb98e5ca9c3
            name: upstream
          - repository: mod-playerbots/azerothcore-wotlk
            ref: 413bea61a85e20d9caef7d66fc601a661fdddd9d
            name: playerbots-core
    name: Compile (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: core
      - uses: actions/checkout@v4
        with:
          path: core/modules/mod-progression
      - name: Install core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-all-dev libmysqlclient-dev libssl-dev libreadline-dev libbz2-dev zlib1g-dev
      - name: Configure real AzerothCore module target
        run: >-
          cmake -S core -B core-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DTOOLS_BUILD=none -DSCRIPTS=none
          -DMODULES=static -DUSE_COREPCH=OFF -DUSE_SCRIPTPCH=OFF
          -DBUILD_TESTING=OFF
      - name: Compile module and generated loader against real headers
        run: cmake --build core-build --target modules --parallel 2
