name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B ../progression-tests -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build ../progression-tests --parallel 2
      - run: ctest --test-dir ../progression-tests --output-on-failure
  core-compile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: azerothcore/azerothcore-wotlk
            ref: db533ad7537a0641d076b13e5611f29f33558d06
            name: upstream
          - repository: mod-playerbots/azerothcore-wotlk
            ref: 413bea61a85e20d9caef7d66fc601a661fdddd9d
            name: playerbots-core
    name: Compile (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: core
      - uses: actions/checkout@v4
        with:
          path: core/modules/mod-progression
      - name: Install core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-all-dev libmysqlclient-dev libssl-dev libreadline-dev libbz2-dev zlib1g-dev
      - name: Apply raid reset hooks
        # The module deliberately requires these hooks; missing patches fail compilation.
        # Verify compatibility with both pinned cores before configuring.
        run: git -C core apply modules/mod-progression/patches/raid-reset-hooks.patch
      - name: Configure patched AzerothCore module target
        run: >-
          cmake -S core -B core-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DTOOLS_BUILD=none -DSCRIPTS=none
          -DMODULES=static -DUSE_COREPCH=OFF -DUSE_SCRIPTPCH=OFF
          -DBUILD_TESTING=OFF
      - name: Compile module and generated loader against real headers
        run: cmake --build core-build --target modules --parallel 2
      - name: Compile modified core source files
        run: >-
          cmake --build core-build --parallel 2 --target
          src/server/game/CMakeFiles/game.dir/Instances/InstanceSaveMgr.cpp.o
          src/server/game/CMakeFiles/game.dir/Scripting/ScriptDefines/WorldScript.cpp.o
